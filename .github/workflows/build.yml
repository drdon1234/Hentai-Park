name: Native platform build
on:
  workflow_call:
    inputs:
      matrix: {required: true, type: string}
      release: {default: false, type: boolean}
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_KEYSTORE_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
      MACOS_CERTIFICATE_BASE64: {required: false}
      MACOS_CERTIFICATE_PASSWORD: {required: false}
      MACOS_SIGN_IDENTITY: {required: false}
      APPLE_NOTARY_KEY_ID: {required: false}
      APPLE_NOTARY_ISSUER: {required: false}
      APPLE_NOTARY_KEY_BASE64: {required: false}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.platform == 'linux' && 'debian:forky' || null }}
    environment: ${{ inputs.release && 'release' || 'build' }}
    timeout-minutes: 55
    defaults:
      run: {shell: bash}
    steps:
      - name: Prepare Linux container
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip xz-utils jq
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: Windows installer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $installerCompiler)) {
            Get-Command choco -ErrorAction Stop | Out-Null
            choco install innosetup --version=6.7.3 --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 安装失败' }
          }
      - name: Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          apt-get install -y clang cmake ninja-build pkg-config dpkg-dev libgtk-3-dev libsecret-1-dev libepoxy-dev libwayland-dev libwpe-1.0-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev libmpv-dev libglu1-mesa
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        with: {xcode-version: latest-stable}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.7', cache: true}
      - name: Trust the installed SDK in the Linux container
        if: matrix.platform == 'linux'
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - name: Validate Apple project files
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          plutil -lint '${{ matrix.platform }}/Runner.xcodeproj/project.pbxproj' '${{ matrix.platform }}/Runner/Info.plist'
      - run: node tools/platform_build.mjs metadata
      - name: Android signing configuration
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ inputs.release && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            mkdir -p test/signing
            printf '%s' "$KEYSTORE" | base64 --decode > test/signing/release.jks
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const escape = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
          writeFileSync('android/key.properties', [
            ['storeFile', resolve('test/signing/release.jks')], ['storePassword', process.env.STORE_PASSWORD],
            ['keyAlias', process.env.KEY_ALIAS], ['keyPassword', process.env.KEY_PASSWORD],
          ].map(([k, v]) => `${k}=${escape(v)}`).join('\n'));
          NODE
            echo 'ANDROID_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_SIGNED=false' >> "$GITHUB_ENV"
            echo '未配置 Android 密钥：仅编译，不分发无签名 APK。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Android build
        if: matrix.platform == 'android'
        run: |
          if [ "$ANDROID_SIGNED" = 'true' ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --release --split-per-abi --android-project-arg=verifyUnsignedBuild=true
          fi
      - if: matrix.platform == 'windows'
        run: flutter build windows --release
      - if: matrix.platform == 'linux'
        run: flutter build linux --release
      - if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          lipo build/macos/Build/Products/Release/HentaiPark.app/Contents/MacOS/HentaiPark -verify_arch arm64 x86_64
      - name: macOS optional Developer ID signing and notarization
        if: matrix.platform == 'macos'
        env:
          CERTIFICATE: ${{ inputs.release && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          APP='build/macos/Build/Products/Release/HentaiPark.app'
          if [ -z "$CERTIFICATE" ]; then
            echo 'macOS 使用 ad-hoc 签名；没有 Developer ID 或公证。' >> "$GITHUB_STEP_SUMMARY"
            codesign --verify --deep --strict "$APP"
            exit 0
          fi
          test -n "$IDENTITY" && test -n "$CERT_PASSWORD"
          mkdir -p test/signing
          printf '%s' "$CERTIFICATE" | base64 --decode > test/signing/certificate.p12
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import test/signing/certificate.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          find "$APP/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
          codesign --force --options runtime --timestamp --entitlements macos/Runner/Release.entitlements --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          if [ -n "$NOTARY_KEY" ]; then
            test -n "$NOTARY_ID" && test -n "$NOTARY_ISSUER"
            printf '%s' "$NOTARY_KEY" | base64 --decode > test/signing/notary.p8
            ditto -c -k --keepParent "$APP" test/signing/notarize.zip
            xcrun notarytool submit test/signing/notarize.zip --key test/signing/notary.p8 --key-id "$NOTARY_ID" --issuer "$NOTARY_ISSUER" --wait
            xcrun stapler staple "$APP"
          else
            echo '已签名，未配置公证 API 凭据：未公证。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: iOS unsigned device check and simulator build
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug
          lipo build/ios/iphonesimulator/Runner.app/Runner -verify_arch x86_64
          echo '仅提供模拟器 .app；没有真机 IPA、TestFlight 或 App Store 分发。' >> "$GITHUB_STEP_SUMMARY"
      - run: node tools/platform_build.mjs package '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}
          path: test/distribution/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf test/signing
          if [ '${{ matrix.platform }}' = macos ] && [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
