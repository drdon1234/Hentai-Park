name: iOS build
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'tools/ios_*'
      - 'tools/platform_build.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      matrix: '{"include":[{"platform":"ios","os":"macos-15","arch":"arm64"}]}'
