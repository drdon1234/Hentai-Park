name: Windows Release
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/windows-ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    environment: release
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Inno Setup 6 is installed
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package Windows Setup EXE and Portable ZIP
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 || '' }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || '' }}
        run: node 'clients/windows/scripts/package-release.mjs' package '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-windows-${{ matrix.arch }}
          path: test/distribution/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          if (Test-Path 'test/signing') {
            Remove-Item -LiteralPath 'test/signing' -Recurse -Force
          }
