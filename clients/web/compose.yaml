services:
  web:
    build: .
    restart: unless-stopped
    environment:
      WEB_SESSION_MODE: server
      HOST: 0.0.0.0
      PORT: '8787'
      DATA_DIR: /data
      DOWNLOAD_DIR: /data/downloads
      WEB_HTTP_PROXY: ${WEB_HTTP_PROXY:-}
      WEB_HTTP_PROXY_ALLOW_LOCAL: ${WEB_HTTP_PROXY_ALLOW_LOCAL:-false}
      WEB_ALLOW_LOCAL_AI: ${WEB_ALLOW_LOCAL_AI:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:?Set a strong instance credential}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:?Set the external HTTPS origin}
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - park-data:/data
volumes:
  park-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${WEB_DOCKER_SUBNET:-}
