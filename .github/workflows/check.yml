name: Checks and platform builds
on:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'android/**', 'windows/**', 'LICENSE', 'docs/licenses/**', 'pubspec.*', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['lib/**', 'assets/**', 'android/**', 'windows/**', 'LICENSE', 'docs/licenses/**', 'pubspec.*', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.7', cache: true}
      - run: flutter pub get
      - shell: pwsh
        run: ./tools/check.ps1
      - id: plan
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/platform_build.mjs plan
  platforms:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.checks.outputs.matrix }}
