name: hentai_park
description: "HentaiPark - pluggable multi-source comic, video, novel & game client"
publish_to: 'none'

version: 0.6.1+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_inappwebview: ^6.2.0-beta.3
  dio: ^5.11.1
