name: Publish official tag translations

on:
  push:
    branches: [main]
    paths:
      - 'assets/tag_translations/**'
      - 'tools/publish_tag_translations.mjs'
      - '.github/workflows/publish-tag-translations.yml'
  workflow_dispatch:

permissions: {}
concurrency:
  group: official-tag-translations
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'drdon1234/Hentai-Park' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish dictionaries index
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          node tools/publish_tag_translations.mjs --commit "$source_commit" --output "$RUNNER_TEMP/tag-index.json"
          parent_args=()
          published_commit=''
          if git ls-remote --exit-code origin refs/heads/tag-translations > "$RUNNER_TEMP/tag-ref"; then
            git fetch --no-tags origin refs/heads/tag-translations:refs/remotes/origin/tag-translations
            published_commit="$(git rev-parse refs/remotes/origin/tag-translations)"
            parent_args=(-p "$published_commit")
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          blob="$(git hash-object -w "$RUNNER_TEMP/tag-index.json")"
          tree="$(printf '100644 blob %s\tindex.json\n' "$blob" | git mktree)"
          if [ -n "$published_commit" ] && [ "$tree" = "$(git rev-parse "$published_commit^{tree}")" ]; then exit 0; fi
          publication="$(git commit-tree "$tree" "${parent_args[@]}" -m "Publish tag translations from $source_commit")"
          git push origin "$publication:refs/heads/tag-translations"
