name: Native platform build
on:
  workflow_call:
    inputs:
      matrix: {required: true, type: string}
      release: {default: false, type: boolean}
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_KEYSTORE_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.release && 'release' || 'build' }}
    timeout-minutes: 55
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: Windows installer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $installerCompiler)) {
            Get-Command choco -ErrorAction Stop | Out-Null
            choco install innosetup --version=6.7.3 --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 安装失败' }
          }
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.7', cache: true}
      - run: flutter pub get
      - run: node tools/platform_build.mjs metadata
      - name: Android signing configuration
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ inputs.release && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            mkdir -p test/signing
            printf '%s' "$KEYSTORE" | base64 --decode > test/signing/release.jks
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const escape = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
          writeFileSync('android/key.properties', [
            ['storeFile', resolve('test/signing/release.jks')], ['storePassword', process.env.STORE_PASSWORD],
            ['keyAlias', process.env.KEY_ALIAS], ['keyPassword', process.env.KEY_PASSWORD],
          ].map(([k, v]) => `${k}=${escape(v)}`).join('\n'));
          NODE
            echo 'ANDROID_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_SIGNED=false' >> "$GITHUB_ENV"
            echo '未配置 Android 密钥：仅编译，不分发无签名 APK。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Android build
        if: matrix.platform == 'android'
        run: |
          if [ "$ANDROID_SIGNED" = 'true' ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --release --split-per-abi --android-project-arg=verifyUnsignedBuild=true
          fi
      - if: matrix.platform == 'windows'
        run: flutter build windows --release
      - run: node tools/platform_build.mjs package '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}
          path: test/distribution/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf test/signing
