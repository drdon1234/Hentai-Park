name: Web Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布 Web Docker 镜像并更新 latest 标签'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/web-docker.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
