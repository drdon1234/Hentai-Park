name: Native Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require a main branch commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: meta
        run: node tools/platform_build.mjs metadata
      - id: plan
        run: node tools/platform_build.mjs plan
      - run: node tools/platform_build.mjs notes docs/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with: {name: release-notes, path: test/release-notes.md, retention-days: 7}
  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
  build:
    needs: [prepare, checks]
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      release: true
    secrets: inherit
  windows:
    needs: prepare
    uses: ./.github/workflows/windows-release.yml
    secrets: inherit
  publish:
    needs: [prepare, build, windows]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'distribution-*', merge-multiple: true, path: test/release}
      - uses: actions/download-artifact@v4
        with: {name: release-notes, path: test/notes}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HentaiPark v${{ needs.prepare.outputs.version }}
          body_path: test/notes/release-notes.md
          files: test/release/*
          fail_on_unmatched_files: true
          make_latest: true
