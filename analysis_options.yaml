# 生产代码使用 Flutter 官方检查规则；测试文件只保存在本地 test/。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - test/**
    - ios/**
    - macos/**
    - linux/**

linter:
  rules:
    - directives_ordering
    - prefer_const_constructors
    - avoid_redundant_argument_values
    - unawaited_futures
    - use_build_context_synchronously
    - prefer_final_locals
