name: Native platform build
on:
  workflow_call:
    inputs:
      matrix: {required: true, type: string}
      release: {default: false, type: boolean}
      require_ios_signing: {default: false, type: boolean}
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_KEYSTORE_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
      IOS_CERTIFICATE_BASE64: {required: false}
      IOS_CERTIFICATE_PASSWORD: {required: false}
      IOS_PROVISIONING_PROFILE_BASE64: {required: false}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.release && 'release' || 'build' }}
    timeout-minutes: 55
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.7', cache: true}
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'ios'
        with: {xcode-version: latest-stable}
      - run: flutter pub get
      - run: node tools/platform_build.mjs metadata
      - name: Android signing configuration
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ inputs.release && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            mkdir -p test/signing
            printf '%s' "$KEYSTORE" | base64 --decode > test/signing/release.jks
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const escape = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
          writeFileSync('android/key.properties', [
            ['storeFile', resolve('test/signing/release.jks')], ['storePassword', process.env.STORE_PASSWORD],
            ['keyAlias', process.env.KEY_ALIAS], ['keyPassword', process.env.KEY_PASSWORD],
          ].map(([k, v]) => `${k}=${escape(v)}`).join('\n'));
          NODE
            echo 'ANDROID_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_SIGNED=false' >> "$GITHUB_ENV"
            echo '未配置 Android 密钥：仅编译，不分发无签名 APK。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Android build
        if: matrix.platform == 'android'
        run: |
          if [ "$ANDROID_SIGNED" = 'true' ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --release --split-per-abi --android-project-arg=verifyUnsignedBuild=true
          fi
      - name: Prepare iOS signing
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE_BASE64: ${{ inputs.release && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ inputs.release && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ inputs.release && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
        run: |
          python3 tools/ios_signing.py prepare
      - name: Require requested iOS signing
        if: matrix.platform == 'ios' && inputs.require_ios_signing
        run: test "$IOS_SIGNED" = 'true'
      - name: iOS device Release build
        if: matrix.platform == 'ios'
        run: |
          plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info.plist ios/Runner/Runner.entitlements ios/Runner/PrivacyInfo.xcprivacy
          if [ "$IOS_SIGNED" = 'true' ]; then
            flutter build ipa --release --export-options-plist=test/signing/ExportOptions.plist
          else
            flutter build ios --release --no-codesign
            echo '生成 unsigned.ipa，需要使用侧载工具签名后安装。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate iOS device binary
        if: matrix.platform == 'ios'
        run: |
          if [ "$IOS_SIGNED" = 'true' ]; then
            APP='build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app'
            codesign --verify --deep --strict "$APP"
          else
            APP='build/ios/iphoneos/Runner.app'
          fi
          lipo "$APP/Runner" -verify_arch arm64
      - name: iOS simulator startup check
        if: matrix.platform == 'ios' && !inputs.release
        run: |
          flutter build ios --simulator --debug
          SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; runtime="com.apple.CoreSimulator.SimRuntime.iOS-"+sys.argv[1].replace(".", "-"); print(next(d["udid"] for d in json.load(sys.stdin)["devices"].get(runtime, []) if d["name"].startswith("iPhone")))' "$SIMULATOR_SDK")
          mkdir -p test/ios-simulator
          cleanup_simulator() {
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              tail -n 80 test/ios-simulator/stdout.log test/ios-simulator/stderr.log 2>/dev/null || true
            fi
            xcrun simctl shutdown "$DEVICE" || true
            exit "$STATUS"
          }
          trap cleanup_simulator EXIT
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          APP_PID=$(xcrun simctl launch --stdout="$PWD/test/ios-simulator/stdout.log" --stderr="$PWD/test/ios-simulator/stderr.log" "$DEVICE" com.hentaipark.hentaiPark | awk -F ': ' '{print $NF}')
          test -n "$APP_PID"
          sleep 20
          # 模拟器应用使用宿主 PID；launchctl list 不保证列出 UIKit 启动的应用。
          kill -0 "$APP_PID"
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE" com.hentaipark.hentaiPark data)
          DATABASE=$(find "$APP_DATA/Library/Application Support" -name park.db -print -quit)
          test -n "$DATABASE"
          test "$(sqlite3 "$DATABASE" "SELECT count(*) FROM sqlite_master WHERE type='table' AND name='works';")" = '1'
      - run: node tools/platform_build.mjs package '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}
          path: test/distribution/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          if [ '${{ matrix.platform }}' = ios ]; then
            python3 tools/ios_signing.py cleanup
          fi
          rm -f android/key.properties
          rm -rf test/signing
